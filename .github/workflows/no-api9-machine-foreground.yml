name: Frozen no-api.9 foreground acceptance
on:
  pull_request:
    paths: ['evidence/no-api9/machine-freeze/foreground-request.json']
permissions:
  contents: read
jobs:
  owned-editors:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dc26fe3c59ba55994d29e99ada8d2f0b49ad9886
          persist-credentials: false
      - name: Check the hosted GUI and run the existing owned-target batch
        shell: bash
        run: |
          set -euo pipefail
          export SAYTILE_ALLOW_FOREGROUND_INPUT_FIXTURES=1
          export SAYTILE_INPUT_SCRATCH="$RUNNER_TEMP/foreground-build"
          export SAYTILE_INPUT_EVIDENCE_DIRECTORY="$RUNNER_TEMP/foreground-evidence"
          mkdir -p "$SAYTILE_INPUT_EVIDENCE_DIRECTORY"
          receipt="$SAYTILE_INPUT_EVIDENCE_DIRECTORY/status.txt"
          git rev-parse HEAD > "$receipt"
          sw_vers >> "$receipt"
          if python3 scripts/test-input-native.py --foreground-batch > "$SAYTILE_INPUT_EVIDENCE_DIRECTORY/run.log" 2>&1; then
            echo 'PASS: both test-owned foreground editors and no-send checks completed.' | tee -a "$receipt"
          elif grep -Eq 'NOT_RUN|FOREGROUND_ABORT' "$SAYTILE_INPUT_EVIDENCE_DIRECTORY/run.log" "$SAYTILE_INPUT_EVIDENCE_DIRECTORY/input-foreground-batch.log" 2>/dev/null; then
            echo 'BLOCKED: foreground fixture prerequisite or activation guard; see trace.' | tee -a "$receipt"
          else
            echo 'FAIL: see foreground fixture trace.' | tee -a "$receipt"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-foreground-receipt
          path: ${{ runner.temp }}/foreground-evidence
          if-no-files-found: error
