name: Black brand option 2
on:
  push:
    branches: [codex/black-brand-option2-20261117]
permissions:
  contents: read
concurrency:
  group: black-brand-option2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package exact integration sources for review
        run: |
          git archive --format=tar HEAD Sources tests scripts packaging .github Package.swift AGENTS.md README.md docs design | gzip > integration-sources.tar.gz
          git rev-parse HEAD > integration-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: black-brand-integration-sources
          path: |
            integration-sources.tar.gz
            integration-revision.txt
          retention-days: 3
