name: Finalize black brand receipts
on:
  push:
    branches: [codex/black-brand-option2-20261117]
    paths: ['.github/workflows/black-brand-bootstrap.yml']
permissions:
  contents: read
concurrency:
  group: black-brand-materialize
  cancel-in-progress: false
jobs:
  receipts:
    if: github.repository == 'haohongfei2001-png/saytile' && github.ref == 'refs/heads/codex/black-brand-option2-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and preserve completed native evidence without changing product sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/black-brand-option2-20261117 | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, json, os, urllib.request, urllib.parse, zipfile, subprocess
          root = Path.cwd()
          api = 'https://api.github.com/repos/haohongfei2001-png/saytile'
          class SignedStorageRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected and urllib.parse.urlsplit(newurl).netloc != 'api.github.com':
                      redirected.remove_header('Authorization')
                      redirected.remove_header('Accept')
                  return redirected
          opener = urllib.request.build_opener(SignedStorageRedirect())
          def get(path):
              request = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with opener.open(request, timeout=60) as response:
                  return response.read()
          run = json.loads(get('/actions/runs/43946954900'))
          assert run['conclusion'] == 'success' and run['head_sha'] == 'b159a2974492a23535b98875b7ae0c3182a5bfcd'
          raw = get('/actions/artifacts/14265199506/zip')
          assert hashlib.sha256(raw).hexdigest() == '930affbe68ab39543fc193e02e21a0ba979eaf1feb4fcb4177608e67e789c6b0'
          allowed = ['revision.txt', 'native.log', 'unit-tests.log', 'app-model.log', 'native/brand-receipt.json', 'native/brand-purple-settings.png', 'native/brand-black-settings.png', 'native/brand-black-dark-settings.png', 'native/brand-black-panel.png', 'native/brand-black-archive.png']
          destination = root / 'evidence/black-brand-option2'
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name in allowed:
                  target = destination / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          assert (destination / 'revision.txt').read_text().strip() == '58919815c91e17c01d6e0695dc885860d9343026'
          assert '10 tests in 2 suites passed' in (destination / 'unit-tests.log').read_text()
          assert 'APP_MODEL_PROBE_PASS 196 checks' in (destination / 'app-model.log').read_text()
          assert 'BRAND_REVIEW_PASS' in (destination / 'native.log').read_text()
          receipt = {'implementation_head': run['head_sha'], 'tested_pr_merge': '58919815c91e17c01d6e0695dc885860d9343026', 'workflow_run': run['id'], 'workflow_url': run['html_url'], 'conclusion': 'success', 'unit_tests': 10, 'app_model_checks': 196, 'native_screenshots': 5, 'physical_click_acceptance': False, 'user_installation': False, 'Finder_static_icon_changed': False, 'artifact_sha256': hashlib.sha256(raw).hexdigest()}
          (destination / 'verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (destination / 'README.md').write_text('# 黑色品牌专项验收\n\n实现提交 `b159a2974492a23535b98875b7ae0c3182a5bfcd`；CI 实际检出 PR 合并测试提交 `58919815c91e17c01d6e0695dc885860d9343026`。\n\n[GitHub Actions #43946954900](https://github.com/haohongfei2001-png/saytile/actions/runs/43946954900) 全部通过：macOS 编译、10 项外观测试、196 项生产 AppModel 隔离回归、5 张真实原生截图。这里只归档原始证据，不重新生成图片或改写测试结果。\n\n确认偏好保存/重建恢复、紫→黑→紫保留原配置、资源加载和浅深色呈现。未进行真实鼠标点击、用户安装或 Finder 静态图标更改验收；未调用麦克风或云模型。\n')
          doc = root / 'docs/BLACK-BRAND-OPTION2.md'
          text = doc.read_text().replace('状态：产品决定已批准；本分支实现与验收进行中，不能据此宣称已安装或发布。', '状态：功能已实现，黑色品牌专项 macOS 编译、回归及原生渲染检查通过；未在用户 Mac 安装或公开发布。')
          text += '\n## 已执行回执（2026-11-16 UTC）\n\n实现 `b159a297`，PR #50 合并测试提交 `58919815`，专项 CI [43946954900](https://github.com/haohongfei2001-png/saytile/actions/runs/43946954900) SUCCESS。10 项外观测试、196 项 AppModel 检查及 5 张原生截图通过；日志和原图已归档到 [evidence/black-brand-option2](../evidence/black-brand-option2/README.md)。本节只确认该功能专项，不把其他仍在运行的整体验收、用户安装或物理点击说成通过。\n'
          doc.write_text(text)
          status = root / 'docs/V1-DEV-STATUS.md'
          text = status.read_text().replace('内测 0.20 可选黑色品牌（实现中）', '内测 0.20 可选黑色品牌（专项验证通过）', 1)
          old = '本段仅记录实现，不把尚未完成的 macOS 编译、界面测试、签名/安装或上线说成通过。'
          new = '实现 b159a297 的专项 CI 43946954900 已通过 macOS 编译、10 项外观测试、196 项 AppModel 回归和 5 张原生截图检查；实际测试的 PR 合并提交为 58919815。物理点击、用户安装与公开上线尚未执行。'
          assert old in text
          status.write_text(text.replace(old, new, 1))
          subprocess.run(['git', 'add', 'docs/BLACK-BRAND-OPTION2.md', 'docs/V1-DEV-STATUS.md', 'evidence/black-brand-option2'], check=True)
          subprocess.run(['python3', 'scripts/update-manifest.py'], check=True)
          # Prepare the final manifest for connector removal of this temporary workflow.
          manifest = root / 'SHA256SUMS.txt'
          lines = manifest.read_text().splitlines(keepends=True)
          manifest.write_text(''.join(line for line in lines if not line.rstrip().endswith('  .github/workflows/black-brand-bootstrap.yml')))
          subprocess.run(['python3', 'scripts/check_integrity.py'], check=True)
          PY
      - name: Commit receipts and final manifest on this branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BLACK-BRAND-OPTION2.md docs/V1-DEV-STATUS.md evidence/black-brand-option2 SHA256SUMS.txt
          git diff --cached --check
          git commit -m 'test(brand): preserve passed macOS appearance and persistence receipts'
          test "$(git ls-remote origin refs/heads/codex/black-brand-option2-20261117 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/black-brand-option2-20261117
