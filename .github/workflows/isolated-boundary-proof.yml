name: Signed native panel in macOS fullscreen
on:
  push:
    branches: [codex/saytile-boundary-proof-20261117]
permissions:
  contents: read
jobs:
  fullscreen:
    runs-on: macos-26
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c0df4728b113c17297a0cded20472de4ffc3337
      - name: Run one native fullscreen entry and exit on the final product sources
        env:
          SAYTILE_PANEL_NATIVE_FULLSCREEN: '1'
          SAYTILE_PANEL_EVIDENCE: /private/tmp/saytile-533-native-fullscreen
        run: |
          test "$(git rev-parse HEAD)" = 7c0df4728b113c17297a0cded20472de4ffc3337
          swift build --scratch-path "$RUNNER_TEMP/fullscreen-build"
          export SAYTILE_PANEL_PRODUCTS="$(swift build --scratch-path "$RUNNER_TEMP/fullscreen-build" --show-bin-path)"
          scripts/test-panel-boundary.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saytile-533-native-fullscreen
          path: |
            /private/tmp/saytile-533-native-fullscreen/report.json
            /private/tmp/saytile-533-native-fullscreen/source-binding.json
            /private/tmp/saytile-533-native-fullscreen/probe.log
            /private/tmp/saytile-533-native-fullscreen/sign.log
            /private/tmp/saytile-533-native-fullscreen/permission.log
            /private/tmp/saytile-533-native-fullscreen/target/*.json
            /private/tmp/saytile-533-native-fullscreen/other/*.json
          retention-days: 7
