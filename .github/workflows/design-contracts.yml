name: Saytile design contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data-and-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Offline ASR quality metrics and provenance
        run: python -m unittest discover -s research/asr/benchmark/quality-evaluation -p 'test_*.py' -v
      - run: python scripts/verify.py --ui
