name: Saytile design contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  data-and-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify.py --ui
  swift-contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -swift-version 6 -typecheck contracts/Contracts.swift
      - run: swiftc -swift-version 6 contracts/Contracts.swift tests/SwiftSmoke.swift -o /tmp/saytile-contract-smoke
      - run: /tmp/saytile-contract-smoke
