name: Saytile design contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data-and-prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact bytes of the sole approved visual reference
        run: echo '58be88a019cf0241b1c540f799d0944ed294e650b8c119923a434a6e4889a7c5  design/approved/Saytile-original-visual-reference-20261107.jpeg' | sha256sum --check --status
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - name: Use the runner browser for headless prototype checks
        run: |
          if browser=$(command -v google-chrome || command -v chromium); then
            "$browser" --version
            echo "SAYTILE_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Offline ASR quality metrics and provenance
        run: python -m unittest discover -s research/asr/benchmark/quality-evaluation -p 'test_*.py' -v
      - run: python scripts/verify.py --ui
      - name: Install Chinese fonts for meaningful website screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match :lang=zh-cn
      - name: Verify the official website and copy-first product description
        run: |
          export PLAYWRIGHT_MODULE="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).parent / "driver" / "package")')"
          export BROWSER_PATH="$SAYTILE_BROWSER_PATH"
          node scripts/test-official-website-scenes.cjs website "$RUNNER_TEMP/saytile-website-110"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Saytile-official-website
          path: ${{ runner.temp }}/saytile-website-110
          if-no-files-found: warn
          retention-days: 14
