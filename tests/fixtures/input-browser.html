<!doctype html><meta charset="utf-8"><title>Saytile isolated DOM fixture</title>
<h1>First synthetic chat</h1><div id="host"></div><button id="send">Synthetic send</button><input id="other">
<script>
let editor, editorGeneration=0, sends=0, dispatches=0, changes=[];
const observer=new MutationObserver(()=>changes.push('layout'));
observer.observe(document.body,{subtree:true,childList:true});
function value(){return editor.matches('textarea')?editor.value:editor.textContent;}
function selection(){if(editor.matches('textarea'))return [editor.selectionStart,editor.selectionEnd-editor.selectionStart];let s=getSelection();let r=document.createRange();r.selectNodeContents(editor);r.setEnd(s.anchorNode,s.anchorOffset);let start=r.toString().length;r.setEnd(s.focusNode,s.focusOffset);let end=r.toString().length;return [Math.min(start,end),Math.abs(start-end)];}
function caret(start,end=start){editor.focus();if(editor.matches('textarea'))editor.setSelectionRange(start,end);else{let r=document.createRange();r.setStart(editor.firstChild,start);r.setEnd(editor.firstChild,end);getSelection().removeAllRanges();getSelection().addRange(r);}}
function reset(kind){history.replaceState({},'','/chat/one');document.querySelector('h1').textContent='First synthetic chat';document.querySelector('#host').innerHTML=kind==='textarea'?'<textarea>PREFIX|SUFFIX</textarea>':'<div contenteditable="true">PREFIX|SUFFIX</div>';editor=document.querySelector('#host').firstChild;editorGeneration++;sends=0;dispatches=0;caret(7);changes=[];}
function snapshot(){const [start,length]=selection();return {element:String(editorGeneration),page:location.href+'|'+document.title,start,length,editable:document.activeElement===editor,secure:false};}
function dispatch(text){if(document.activeElement!==editor||selection()[1])return {ok:false};if(editor.matches('textarea'))editor.setRangeText(text,editor.selectionStart,editor.selectionEnd,'end');else{const r=getSelection().getRangeAt(0);r.insertNode(document.createTextNode(text));r.collapse(false);getSelection().removeAllRanges();getSelection().addRange(r);}editor.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:text}));dispatches++;return {ok:true};}
async function mutation(name){changes=[];if(name==='selection'){caret(0,6);changes.push('content');}if(name==='sameURL'){document.querySelector('h1').textContent='Second chat same URL';}if(name==='replace'){editor.outerHTML=editor.outerHTML;editor=document.querySelector('#host').firstChild;editorGeneration++;}if(name==='newURL'){history.pushState({},'','/chat/two');changes.push('layout');}if(name==='focusAwayBack'){document.querySelector('#other').focus();editor.focus();changes.push('focus');}await new Promise(r=>setTimeout(r,0));return {changes};}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){sends++;e.preventDefault();}});document.querySelector('#send').onclick=()=>sends++;
</script>
