function icon(name){return '<svg aria-hidden="true" viewBox="0 0 24 24">'+(icons[name]||icons.info)+'</svg>'}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 {id:'a3',time:'22:13:46',duration:'00:22',text:'也不一定每句话都要马上发给 ChatGPT。先放在一个安静的小面板里，想好以后再插入。',status:'done'}
];

 {id:'r1',day:'今天',time:'22:12',duration:'01:06',title:'让表达先被留下',text:sampleSegments.map(s=>s.text).join('\n\n'),tag:'产品想法',favorite:true},

function dots(className=''){return '<span class="dots-mark '+className+'"><i></i><i></i><i></i></span>'}
function wave(seed=1,count=45){return '<div class="wave '+(state.playing?'playing':'')+'">'+Array.from({length:count},(_,i)=>'<i style="height:'+(4+((i*7+seed*13)%19))+'px"></i>').join('')+'</div>'}
function traffic(){return '<span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>'}
function button(label,action,cls='',ico=''){return '<button class="'+cls+'" data-action="'+action+'">'+(ico?icon(ico):'')+label+'</button>'}
function setScene(scene){if(!scenes.some(s=>s[0]===scene))scene='standby';stopTimers();state.scene=scene;state.collapsed=false;state.recording=false;state.follow=true;state.unseen=0;state.playing=false;state.editing=false;state.recovered=false;state.targetValid=true;state.paused=false;state.mode='record';invalidateDemoBinding();state.savedSecond=8;currentDraft='';state.segments=scene==='continuous'?structuredClone(sampleSegments):scene==='recovery'?[structuredClone(sampleSegments[0])]:[];render();try{const u=new URL(location.href);u.searchParams.set('scene',scene);history.replaceState(null,'',u)}catch{}if(scene==='live')setTimeout(()=>{if(state.scene==='live')startSpeech(true)},400)}
function stopTimers(){clearInterval(streamTimer);clearInterval(saveTimer);clearInterval(playTimer);streamTimer=saveTimer=playTimer=null}
function render(){renderTabs();$('active-app').textContent=['archive','settings','onboarding'].includes(state.scene)?'Saytile':'ChatGPT';$('scene-explanation').innerHTML='<strong>'+scenes.find(s=>s[0]===state.scene)[1]+'</strong>　'+scenes.find(s=>s[0]===state.scene)[2];$('scene-content').innerHTML=['archive','settings','onboarding'].includes(state.scene)?state.scene==='archive'?archiveHTML():state.scene==='settings'?settingsHTML():onboardingHTML():desktopHTML();$('menu-popover').classList.add('hidden');$('menu-button').classList.remove('open');updateMenu();bindScroll();if($('target-draft'))$('target-draft').value=currentDraft;if(state.scene==='archive')bindSearch();if(state.scene==='settings')bindSettings()}
function renderTabs(){$('scene-tabs').innerHTML=scenes.map((s,i)=>'<button class="scene-tab '+(state.scene===s[0]?'active':'')+'" data-scene="'+s[0]+'" aria-current="'+(state.scene===s[0]?'page':'false')+'"><span>0'+(i+1)+'</span>'+s[1]+'</button>').join('')}
function updateMenu(){const status=state.playing?'回放中，收音暂歇':state.paused?'已暂停收音':state.recording?'正在接收讲话':state.scene==='recovery'&&!state.recovered?'原音已保存 · 有一段待恢复':state.scene==='onboarding'&&!state.permissions.mic?'尚未开启':'已开启待命';$('menu-mark').className='dots-mark '+(state.paused?'paused':state.recording?'speaking':state.scene==='recovery'&&!state.recovered?'error':'');$('menu-button').title='Saytile · '+status;$('popover-status').textContent=status;$('menu-pause').innerHTML=(state.paused?'恢复待命':'暂停收音')+' <kbd>⌥ ⌘ P</kbd>';$('mic-indicator').classList.toggle('hidden',state.paused||state.playing||(state.scene==='onboarding'&&!state.permissions.mic));}
function desktopHTML(){return '<section class="desktop-window" aria-label="模拟 ChatGPT 目标窗口"><div class="window-chrome">'+traffic()+'<span class="window-title">'+icon('lock')+' chatgpt.com</span><span class="chrome-actions">'+icon('export')+icon('plus')+'</span></div><div class="chat-app"><aside class="chat-rail"><span class="wordmark">✳</span>'+icon('edit')+icon('search')+icon('grid')+'<span class="avatar">H</span></aside><div class="chat-main"><div class="chat-top"><span>ChatGPT <small>⌄</small></span>'+button('切换会话','change-target','scene-change','retry')+'</div><div class="chat-conversation"><div class="user-bubble">帮我一起梳理这个产品的核心价值。</div><div class="assistant-text"><strong>我们可以先从真实的表达习惯开始。</strong><p>当你想到一件事，最希望工具替你做什么？</p><span class="answer-line"></span><span class="answer-line"></span></div></div><div class="compose '+(state.mode==='direct'&&state.targetValid?'bound':'')+'" id="compose"><textarea id="target-draft" aria-label="模拟 ChatGPT 草稿" placeholder="在这里编辑草稿，或从Saytile插入…"></textarea><div class="compose-bottom"><div>'+icon('plus')+'<span style="font-size:9px">工具</span></div><span class="send-fake" title="本演示不发送消息" aria-label="不发送消息">'+icon('arrow')+'</span></div></div><p class="chat-foot">演示目标 · 插入的内容只出现在此草稿中，不会发送</p></div></div></section>'+panelHTML()+'<aside class="desktop-note"><span class="note-rule"></span><div><h3>让表达自然发生</h3><p>开口、停顿、继续。思路留下来，工作保持原样。</p></div></aside><div class="scenario-tools"><span class="small-label">模拟操作</span>'+button(state.recording?'结束这段':'说一段话','speak','main',state.recording?'check':'mic')+button(state.paused?'恢复待命':'暂停收音','pause','',state.paused?'play':'pause')+button('增量不重复','incremental-demo')+button('前缀改写','rewrite-demo')+button('重启演示','restart-demo')+'</div>'}
function panelHTML(){return '<section class="panel '+(state.collapsed?'collapsed':'')+(!state.segments.length?' is-empty':'')+'" aria-label="Saytile即时输入板" id="voice-panel"><header class="panel-head"><div class="panel-title">'+dots(state.recording?'speaking':'')+'<span>此刻</span></div><div class="head-icons">'+button('','archive','icon-btn','archive')+button('','collapse','icon-btn','minus')+'</div></header><div class="mode-selector" aria-label="记录模式"><button class="mode-btn '+(state.mode==='record'?'selected':'')+'" data-mode="record">'+icon('mic')+'自由记录</button><button class="mode-btn '+(state.mode==='direct'?'selected':'')+'" data-mode="direct">'+icon('target')+'直接输入</button></div>'+targetHTML()+(state.playing?'<div class="paused-banner">'+icon('volume')+'回放中，收音暂歇。</div>':state.paused?'<div class="paused-banner">'+icon('pause')+'收音已暂停。已有内容仍然可以使用。</div>':'')+'<div class="transcript-area" id="transcript-area">'+transcriptHTML()+'</div>'+(state.unseen?'<button class="new-content" data-action="follow">'+icon('arrowDown')+' '+state.unseen+' 段新内容</button>':'')+footerHTML()+'</section>'}
function targetHTML(){return state.mode==='direct'?'<div class="target-strip '+(!state.targetValid?'warning':'')+'"><span>'+icon(state.targetValid?'target':'disconnect')+(state.targetValid?'已绑定 ChatGPT · 当前草稿':'目标已变化 · 新内容留在此处')+'</span>'+(state.targetValid?'<button data-action="unbind">解除</button>':'<button data-action="rebind">重新绑定</button>')+'</div>':''}

function segmentHTML(s,index){return '<article class="transcript '+(s.status==='live'?'live':'')+'" data-segment="'+s.id+'"><div class="segment-top"><time>'+s.time+'</time><span class="mini-state">'+(s.status==='live'?'<span class="spinner"></span>形成中':icon('check')+'原音已保存')+'</span></div><p class="transcript-text">'+escapeHTML(s.text)+(s.status==='live'?'<span class="typing-caret"></span>':'')+'</p><div class="segment-actions">'+button(s.duration,'play-segment','','play')+'<span class="actions-right">'+(s.status!=='live'?'<button data-action="edit-segment" data-id="'+s.id+'">'+icon('edit')+'修改</button><button data-action="copy-segment" data-id="'+s.id+'">'+icon('copy')+'复制</button>':'<span>你可以继续说</span>')+'</span></div></article>'}
function footerHTML(){const hasText=state.segments.some(s=>s.text);return '<footer class="panel-footer"><div class="saved-line"><span>'+icon('shield')+(state.recording?'原音已保存至 22:14:'+String(state.savedSecond).padStart(2,'0'):hasText?'所有原音已保存在此 Mac':'麦克风待命 · 收音状态清晰可见')+'</span>'+(hasText?'<span>'+state.segments.length+' 段</span>':'')+'</div><div class="footer-actions">'+button('','settings','icon-btn','settings')+'<span class="spacer"></span><button class="small-button" data-action="copy" '+(!hasText?'disabled':'')+'>'+icon('copy')+'复制</button><button class="small-button primary" data-action="insert" '+(!hasText?'disabled':'')+'>'+icon('insert')+'插入草稿</button></div><div class="footer-key"><span class="pause-label">'+icon(state.paused?'pause':'local')+(state.paused?'收音已暂停':'内容随时可用')+'</span><span class="key-pair">展开 / 收起 <kbd>⌥ Space</kbd></span></div></footer>'}
function redrawPanel(){const area=$('transcript-area');const top=area?area.scrollTop:0;const previous=$('voice-panel');if(previous){previous.outerHTML=panelHTML();bindScroll();const now=$('transcript-area');if(now)now.scrollTop=state.follow?now.scrollHeight:top}updateMenu();const speak=document.querySelector('.scenario-tools [data-action="speak"]');if(speak)speak.innerHTML=icon(state.recording?'check':'mic')+(state.recording?'结束这段':'说一段话');const pause=document.querySelector('.scenario-tools [data-action="pause"]');if(pause)pause.innerHTML=icon(state.paused?'play':'pause')+(state.paused?'恢复待命':'暂停收音')}
function bindScroll(){const el=$('transcript-area');if(el)el.addEventListener('scroll',()=>{state.follow=el.scrollHeight-el.scrollTop-el.clientHeight<35;if(state.follow&&state.unseen){state.unseen=0;document.querySelector('.new-content')?.remove()}},{passive:true});const draft=$('target-draft');if(draft)draft.oninput=()=>{currentDraft=draft.value}}
const speechTexts=['真正自然的语音输入，应该允许我先把想法说完。中间可以停一停，也可以接着说，不必担心刚才的内容消失。','下一步，我们先验证连续收音和可靠保存。让识别慢一点没有关系，重要的是每一段声音都能找回来。','还有一个细节：切换到另一个窗口时，新的文字应该安静地留在输入板，等我选择之后再插入。','刚才想到的这个点也记下来：产品的价值，是让我不用再反复想起那个麦克风按钮。'];
function startSpeech(initial=false){if(state.playing){toast('回放中，收音暂歇。停止回放后可以继续说。');return}if(state.paused){toast('先恢复待命，再开始模拟讲话。');return}if(state.recording){finishSpeech();return}const txt=speechTexts[state.liveIndex%speechTexts.length];state.liveIndex++;const s={id:'s'+Date.now(),time:'22:14:'+String(state.savedSecond).padStart(2,'0'),duration:'00:00',text:'',status:'live',full:txt};state.segments.push(s);state.recording=true;if(!state.follow)state.unseen++;let pos=0,elapsed=0;redrawPanel();streamTimer=setInterval(()=>{pos=Math.min(txt.length,pos+(pos<12?1:2));s.text=txt.slice(0,pos);s.duration='00:'+String(Math.floor(pos/4)).padStart(2,'0');redrawPanel();if(pos>=txt.length)finishSpeech()},160);saveTimer=setInterval(()=>{elapsed++;state.savedSecond=Math.min(59,8+elapsed);const el=document.querySelector('.saved-line span');if(el)el.innerHTML=icon('shield')+'原音已保存至 22:14:'+String(state.savedSecond).padStart(2,'0')},1000)}
function finishSpeech(){clearInterval(streamTimer);clearInterval(saveTimer);streamTimer=saveTimer=null;const s=state.segments.findLast(s=>s.status==='live');if(s){s.status='done';if(!s.text)s.text=s.full.slice(0,10);s.duration='00:'+String(Math.max(3,Math.ceil(s.text.length/4))).padStart(2,'0');delete s.full;if(state.mode==='direct'&&state.targetValid){applyStableSegment(s.id,s.text,s.text.length)}}state.recording=false;redrawPanel()}
function togglePause(){if(state.recording)finishSpeech();state.paused=!state.paused;redrawPanel();updateMenu();toast(state.paused?'收音已暂停。点击菜单栏可随时恢复。':'已恢复待命。可以继续说。')}
function allText(){return state.segments.filter(s=>s.status==='done').map(s=>s.text).join('\n\n')}
async function copyText(text){if(!text){toast('这段文字还在形成，完成后即可复制。');return}try{await navigator.clipboard.writeText(text);clipboardValue=text;toast('已复制到剪贴板。')}catch{clipboardValue=text;showCopyFallback(text)}}
function showCopyFallback(text){$('dialog-host').innerHTML='<div class="permission-explainer"><div class="permission-dialog" style="width:410px"><h3>请手动复制这段文字</h3><p>当前浏览器未允许剪贴板写入。文字仍然保留，你可以选中后按 ⌘C 或 Ctrl+C。</p><textarea class="editor-area" id="manual-copy" readonly style="height:150px">'+escapeHTML(text)+'</textarea><div class="dialog-actions" style="margin-top:15px">'+button('完成','close-dialog')+'</div></div></div>';setTimeout(()=>{$('manual-copy')?.select()},40)}
function insertText(text,automatic=false,continuation=false){
 if(!text){toast('等这段文字稳定后，再插入草稿。');return false}
 if(!state.targetValid){toast('目标已变化。文字保留在输入板，请先重新绑定。');return false}
 const target=$('target-draft');
 if(!target){if(automatic)return false;setScene('continuous');state.mode='direct';state.targetValid=true;render();return insertText(text)}
 const before=target.value;let start=target.selectionStart??before.length,end=target.selectionEnd??start;
 if(start!==end){toast('目标中有选中文字。请先放好光标，避免覆盖。');return false}
 if(automatic)start=before.length;
 const sep=!continuation&&start>0&&!before.slice(0,start).endsWith('\n')?'\n\n':'';
 currentDraft=before.slice(0,start)+sep+text+before.slice(start);target.value=currentDraft;
 target.setSelectionRange(start+sep.length+text.length,start+sep.length+text.length);
 toast(automatic?'稳定文字已进入演示草稿，尚未发送。':'已插入演示草稿，尚未发送。');return true;
}

function retryRecognition(){const btn=document.querySelector('.notice button');if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>正在从原音恢复'}setTimeout(()=>{state.recovered=true;state.segments.push({id:'recovered',time:'22:13:46',duration:'00:28',text:'我们要把采集、保存和识别分开。就算这一段暂时没有识别出来，声音也应该一直在，我可以随时回来继续。',status:'done'});redrawPanel();toast('这段文字已恢复，原音保持可回放。')},1500)}
function syncPlaybackUI(){if($('voice-panel'))redrawPanel();else updateMenu();document.querySelectorAll('.wave').forEach(w=>w.classList.toggle('playing',state.playing));document.querySelectorAll('[data-action="play-segment"],[data-action="play-record"]').forEach(b=>b.innerHTML=icon(state.playing?'pause':'play'));const ps=$('playback-status');if(ps)ps.textContent=state.playing?'回放中，收音暂歇。':state.paused?'收音已暂停。':'回放已结束，继续待命。'}
function togglePlayback(){if(!state.playing&&state.recording)finishSpeech();state.playing=!state.playing;syncPlaybackUI();if(state.playing){toast('回放中，收音暂歇 · 此处为模拟播放');clearInterval(playTimer);let sec=0;playTimer=setInterval(()=>{sec++;const t=$('play-time');if(t)t.textContent='00:'+String(sec).padStart(2,'0')+' / 01:06';if(sec>=10){clearInterval(playTimer);state.playing=false;syncPlaybackUI()}},1000)}else clearInterval(playTimer)}

})}
function onboardingHTML(){return '<section class="desktop-app onboarding" aria-label="首次开启"><header class="window-chrome">'+traffic()+'<span class="archive-title">欢迎使用Saytile</span><span style="width:25px"></span></header><div class="onboarding-body"><div class="onboarding-mark" aria-hidden="true">'+Array(25).fill('<i></i>').join('')+'</div><h2>开口，思路就留下。</h2><p class="onboarding-desc">一个安静的个人语音工作台。<br>随时接住你的表达，可靠留下声音和文字，随时取用。</p>'+permissionCard('mic','麦克风','用于待命收音，自动记录有效讲话。','必需','mic')+permissionCard('access','插入其他应用','将你选择的文字放进当前输入框。','可选','insert')+'<div class="download-status">'+icon('checkCircle')+'<div><strong>中文识别已就绪（演示）</strong><small>正式引擎需实机验证；演示不会处理或上传语音</small></div></div><div class="onboarding-footer"><button class="start-button" data-action="start-onboarding" '+(!state.permissions.mic?'disabled':'')+'>开启自由记录 '+icon('chevron')+'</button><p>开启后，菜单栏会持续显示收音状态。<br>你可以随时暂停；关闭这个窗口不等于关闭收音。</p></div></div></section>'}
function permissionCard(key,title,description,optional,ico){return '<div class="permission-card '+(state.permissions[key]?'granted':'')+'"><span class="permission-icon">'+icon(ico)+'</span><div class="permission-copy"><strong>'+title+'<small>'+optional+'</small></strong><p>'+description+'</p></div>'+(state.permissions[key]?'<span class="permission-check">'+icon('check')+'已允许</span>':button('允许…','grant-'+key))+'</div>'}
function requestPermission(key){const mic=key==='mic';$('dialog-host').innerHTML='<div class="permission-explainer"><div class="permission-dialog"><div class="permission-icon">'+icon(mic?'mic':'insert')+'</div><h3>'+(mic?'允许Saytile使用麦克风？':'允许Saytile插入你选择的文字？')+'</h3><p>'+(mic?'开启待命后，声音在本机检测和保存。你可以随时从菜单栏暂停。':'正式应用会引导你到系统设置授权辅助功能。它用于确认输入目标与插入文字，不会自动发送消息。')+'<br><br><strong>这是权限流程演示，不会请求真实系统权限。</strong></p><div class="dialog-actions">'+button('暂时不要','close-dialog')+'<button data-confirm-permission="'+key+'">允许演示</button></div></div></div>'}
function editSegment(id){const article=document.querySelector('[data-segment="'+id+'"]');const s=state.segments.find(x=>x.id===id);if(!article||!s)return;article.querySelector('.transcript-text').outerHTML='<textarea class="transcript-text editing" aria-label="修改语音文字" id="segment-editor">'+escapeHTML(s.text)+'</textarea>';article.querySelector('.actions-right').innerHTML='<button data-action="save-segment" data-id="'+id+'">'+icon('check')+'保存</button>';article.querySelector('textarea').focus()}
function exportRecord(record){const text=record.title+'\n'+record.day+' '+record.time+' · '+record.duration+'\n\n'+record.text+'\n\n[交互原型示例，不含真实录音]\n';const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='saytile-'+record.id+'-demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('示例文字已导出。原型中没有真实录音文件。')}
function handleAction(action,el){switch(action){
case 'confirm-retention':if(pendingRetention){state.settings.retention=pendingRetention;pendingRetention=null;$('dialog-host').innerHTML='';persistDemo();render();toast('保留策略已更新；没有执行清理。')}break;
case 'reset-demo':try{localStorage.removeItem(DEMO_KEY)}catch{}state.archive=structuredClone(archiveSeed);state.selectedRecord='r1';state.search='';state.archiveFilter='all';state.settings.retention='保留至手动删除';state.settings.engine='自动推荐';lastDeleted=null;setScene('standby');persistDemo();toast('示例已重置，不影响任何真实资料。');break;
case 'delete-audio':$('dialog-host').innerHTML='<div class="permission-explainer"><div class="permission-dialog"><h3>只删除原音？</h3><p>保留识别文字、全部修改稿和历史记录；删除后不能回听或重新识别。此操作只影响本地演示数据。</p><div class="dialog-actions">'+button('取消','close-dialog')+button('删除原音，保留文字','confirm-delete-audio')+'</div></div></div>';break;
case 'confirm-delete-audio':{const r=state.archive.find(r=>r.id===state.selectedRecord);if(r){r.audioDeleted=true;state.playing=false;clearInterval(playTimer);$('dialog-host').innerHTML='';persistDemo();refreshArchive();toast('原音已删除，文字与修改稿保留。')}break;}
case 'incremental-demo':if(state.mode!=='direct')bindDirect();if(!demoLedger.has('incremental-demo'))applyStableSegment('incremental-demo','你好',2);applyStableSegment('incremental-demo','你好，世界',5);applyStableSegment('incremental-demo','你好，世界',5);break;
case 'rewrite-demo':if(state.mode!=='direct')bindDirect();if(!demoLedger.has('incremental-demo'))applyStableSegment('incremental-demo','你好',2);applyStableSegment('incremental-demo','你们好',3);break;
case 'restart-demo':persistDemo();location.reload();break;
case'speak':startSpeech();break;case'pause':togglePause();break;case'archive':setScene('archive');break;case'settings':setScene('settings');break;case'standby':setScene('standby');break;case'copy':copyText(allText());break;case'copy-segment':copyText(state.segments.find(s=>s.id===el.dataset.id)?.text||'');break;case'insert':insertText(allText());break;case'change-target':targetChanged();break;case'rebind':newDemoBinding();state.targetValid=true;redrawPanel();$('compose')?.classList.add('bound');toast('已绑定新草稿。之前的内容请手动插入。');break;case'unbind':invalidateDemoBinding();state.mode='record';redrawPanel();$('compose')?.classList.remove('bound');toast('已切回自由记录。');break;case'retry':retryRecognition();break;case'play-segment':case'play-record':if(action==='play-record'&&state.archive.find(r=>r.id===state.selectedRecord)?.audioDeleted){toast('原音已删除，文字仍可用。');break}togglePlayback();break;case'collapse':state.collapsed=!state.collapsed;redrawPanel();break;case'show-panel':if(!['standby','live','continuous','recovery'].includes(state.scene))setScene('standby');state.collapsed=false;redrawPanel();$('menu-popover').classList.add('hidden');break;case'follow':state.follow=true;state.unseen=0;redrawPanel();break;case'edit-segment':editSegment(el.dataset.id);break;case'save-segment':{const s=state.segments.find(s=>s.id===el.dataset.id);if(s){s.originalText=s.originalText??s.text;s.revisions=s.revisions||[];s.revisions.push(s.text);s.text=$('segment-editor').value;redrawPanel();toast('修订已保存。原始文字与原音仍然保留。')}break}case'favorite':{const r=state.archive.find(r=>r.id===state.selectedRecord);if(r){r.favorite=!r.favorite;refreshArchive();toast(r.favorite?'已收藏这段记录。':'已取消收藏。')}break}case'copy-record':copyText(state.archive.find(r=>r.id===state.selectedRecord)?.text||'');break;case'reuse-record':{const r=state.archive.find(r=>r.id===state.selectedRecord);if(r){const text=r.text;setScene('continuous');state.segments=[{id:'reused',time:'22:14:08',duration:r.duration,text,status:'done'}];render();toast('已带到输入板。点击“插入草稿”即可复用。')}break}case'edit-record':state.editing=true;$('archive-detail').innerHTML=archiveDetailHTML();break;case'cancel-edit':state.editing=false;$('archive-detail').innerHTML=archiveDetailHTML();break;case'save-edit':{const r=state.archive.find(r=>r.id===state.selectedRecord);if(r){r.originalText=r.originalText??r.text;r.revisions=r.revisions||[];r.revisions.push(r.text);r.text=$('record-editor').value;state.editing=false;refreshArchive();toast('修订稿已保存，原始识别文字保留。')}break}case'retry-record':{if(state.archive.find(r=>r.id===state.selectedRecord)?.audioDeleted){toast('原音已删除，不能重新识别。');break}toast('正在用保留的原音重新识别…');setTimeout(()=>toast('重新识别已完成。原文与修订稿都保留。'),1500);break}case'delete-record':$('dialog-host').innerHTML='<div class="permission-explainer"><div class="permission-dialog"><h3>删除整条记录？</h3><p>这会移除本条记录的文字、修改稿与原音。仅想腾出音频空间，请使用“仅删除原音”。</p><div class="dialog-actions">'+button('取消','close-dialog')+button('删除整条记录','confirm-delete-record')+'</div></div></div>';break;case'confirm-delete-record':{$('dialog-host').innerHTML='';const index=state.archive.findIndex(r=>r.id===state.selectedRecord);if(index>=0){lastDeleted={index,record:state.archive[index]};state.archive.splice(index,1);state.selectedRecord=state.archive[Math.min(index,state.archive.length-1)]?.id;refreshArchive();toast('记录已移除，可撤销。',true)}break}case'undo-delete':if(lastDeleted){state.archive.splice(lastDeleted.index,0,lastDeleted.record);state.selectedRecord=lastDeleted.record.id;lastDeleted=null;refreshArchive();toast('记录与原音已恢复。')}break;case'export-record':{const r=state.archive.find(r=>r.id===state.selectedRecord);if(r)exportRecord(r);break}case'export-all':exportRecord({id:'all',title:'Saytile · 全部示例记录',day:'',time:'',duration:'',text:state.archive.map(r=>r.title+'\n'+r.text).join('\n\n——\n\n')});break;case'seek':document.querySelectorAll('.text-block p').forEach(p=>p.classList.remove('highlight'));el.closest('.text-block')?.querySelector('p').classList.add('highlight');$('play-time').textContent='00:'+String(Number(el.dataset.paragraph)*19).padStart(2,'0')+' / 01:06';if(!state.playing)togglePlayback();break;case'grant-mic':requestPermission('mic');break;case'grant-access':case'grant-accessibility':requestPermission('access');break;case'close-dialog':$('dialog-host').innerHTML='';break;case'start-onboarding':if(state.permissions.mic){setScene('standby');toast('自由记录已开启（演示）。从菜单栏随时暂停。')}break;case'add-exclude':if(!state.settings.excludes.includes('银行与支付')){state.settings.excludes.push('银行与支付');render();toast('已添加“银行与支付”示例排除项。')}else toast('示例排除项已添加。');break;case'clear-archive':$('dialog-host').innerHTML='<div class="permission-explainer"><div class="permission-dialog"><h3>删除全部示例档案？</h3><p>将移除本次演示中的 '+state.archive.length+' 条记录。真实产品会同时说明原音和文字的删除范围。</p><div class="dialog-actions">'+button('取消','close-dialog')+button('删除示例','confirm-clear')+'</div></div></div>';break;case'confirm-clear':state.archive=[];state.selectedRecord=null;$('dialog-host').innerHTML='';toast('示例档案已清空。刷新页面可以重置演示。');break}}
document.addEventListener('click',event=>{const el=event.target.closest('button');if(!el)return;if(el.dataset.scene){setScene(el.dataset.scene);return}if(el.id==='menu-button'){$('menu-popover').classList.toggle('hidden');el.classList.toggle('open');return}if(el.dataset.mode){if(el.dataset.mode==='direct')bindDirect();else{invalidateDemoBinding();state.mode='record';redrawPanel();$('compose')?.classList.remove('bound')}return}if(el.dataset.record){state.selectedRecord=el.dataset.record;state.editing=false;state.playing=false;clearInterval(playTimer);refreshArchive();return}if(el.dataset.filter){state.archiveFilter=el.dataset.filter;refreshArchive();return}if(el.dataset.settingTab){state.settingsTab=el.dataset.settingTab;render();return}if(el.dataset.toggle){state.settings[el.dataset.toggle]=!state.settings[el.dataset.toggle];el.classList.toggle('on',state.settings[el.dataset.toggle]);el.setAttribute('aria-checked',state.settings[el.dataset.toggle]);persistDemo();toast('偏好已在本次演示中更新。');return}if(el.dataset.removeExclude){state.settings.excludes=state.settings.excludes.filter(a=>a!==el.dataset.removeExclude);render();return}if(el.dataset.confirmPermission){state.permissions[el.dataset.confirmPermission]=true;$('dialog-host').innerHTML='';render();toast('权限步骤已完成（演示）。');return}if(el.dataset.action){handleAction(el.dataset.action,el);persistDemo()}});
document.addEventListener('click',event=>{if(!event.target.closest('#menu-button')&&!event.target.closest('#menu-popover')){$('menu-popover').classList.add('hidden');$('menu-button').classList.remove('open')}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('dialog-host').innerHTML='';$('menu-popover').classList.add('hidden');$('menu-button').classList.remove('open');return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(event.key>='1'&&event.key<='7')setScene(scenes[Number(event.key)-1][0]);if(event.code==='Space'&&!event.altKey){event.preventDefault();togglePause()}if((event.metaKey||event.ctrlKey)&&event.key==='f'&&state.scene==='archive'){event.preventDefault();$('archive-search').focus()}});

const DEMO_KEY='saytile-v1-recovery-demo-v2';
let demoBinding=null,demoLedger=new Map(),demoCounter=0,pendingRetention=null;
function persistDemo(){try{localStorage.setItem(DEMO_KEY,JSON.stringify({archive:state.archive,settings:state.settings}))}catch{}}
function restoreDemo(){try{const x=JSON.parse(localStorage.getItem(DEMO_KEY)||'null');if(x&&Array.isArray(x.archive)){state.archive=x.archive;state.selectedRecord=x.archive[0]?.id||null;if(x.settings)Object.assign(state.settings,x.settings)}}catch{}}
function newDemoBinding(){demoBinding='demo-binding-'+(++demoCounter);demoLedger=new Map()}
function invalidateDemoBinding(){demoBinding=null;demoLedger=new Map()}
function applyStableSegment(id,text,end){
 if(state.mode!=='direct'||!state.targetValid||!demoBinding)return false;
 if(!Number.isInteger(end)||end<0||end>text.length)return false;
 if(end>0&&end<text.length&&/[\uD800-\uDBFF]/.test(text[end-1])&&/[\uDC00-\uDFFF]/.test(text[end]))return false;
 const stable=text.slice(0,end),sent=demoLedger.get(id)||'';
 if(!stable.startsWith(sent)){state.targetValid=false;redrawPanel();toast('已输入的前缀发生改写。自动追加已暂停，原文仍保留。');return false}
 if(stable===sent)return true;
 const target=$('target-draft');if(!target||target.selectionStart!==target.selectionEnd){toast('请先放好光标，避免覆盖已有文字。');return false}
 // In-memory demonstration only. The SQLite reference reserves atomically.
 demoLedger.set(id,stable);
 return insertText(stable.slice(sent.length),true,sent.length>0);
}
restoreDemo();

if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
setScene(new URLSearchParams(location.search).get('scene')||'standby');
</script>
